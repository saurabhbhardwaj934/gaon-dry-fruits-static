<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Gaon Dry Fruits</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="top-bar">
    <div class="container">
      <span><i class="fas fa-leaf"></i> 100% Natural</span>
      <span><i class="fas fa-truck"></i> Fast & Safe Delivery</span>
      <span><i class="fas fa-award"></i> Premium Quality</span>
      <span><i class="fas fa-lock"></i> Secure Payment</span>
    </div>
  </div>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><div><div class="logo-text">Gaon</div><div class="logo-sub">Dry Fruits</div></div></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
      </ul>
      <div class="nav-icons">
        <a href="cart.html" style="position:relative"><i class="fas fa-shopping-cart"></i><span class="cart-count" style="display:none">0</span></a>
      </div>
    </div>
  </nav>

  <div class="container checkout-page" id="checkoutContent">
    <!-- Filled by JS -->
  </div>

  <script src="js/main.js"></script>
  <script>
    const items = Cart.getItems();
    if (items.length === 0) { window.location.href = 'cart.html'; }

    const user = User.getCurrent();
    let formData = {
      name: user?.name || '', email: user?.email || '', phone: user?.phone || '',
      street: user?.address?.street || '', city: user?.address?.city || '',
      state: user?.address?.state || '', pincode: user?.address?.pincode || ''
    };
    let paymentMethod = 'COD';
    let orderPlaced = false;
    let trackingId = '';

    function renderCheckout() {
      const subtotal = Cart.getSubtotal();
      const shipping = Cart.getShipping(subtotal);
      const total = Cart.getTotal(subtotal, shipping);

      document.getElementById('checkoutContent').innerHTML = `
        <h2 style="font-family:'Playfair Display';font-size:32px;color:var(--green-dark);margin-bottom:30px">Checkout</h2>
        <div class="checkout-layout">
          <div>
            <div class="checkout-section reveal">
              <h3><i class="fas fa-map-marker-alt"></i> Shipping Address</h3>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px">
                <div class="form-group"><label>Full Name</label><input id="fname" value="${formData.name}" placeholder="Enter your name"></div>
                <div class="form-group"><label>Phone Number</label><input id="fphone" value="${formData.phone}" placeholder="+91 XXXXX XXXXX"></div>
                <div class="form-group" style="grid-column:1/-1"><label>Email</label><input id="femail" value="${formData.email}" placeholder="your@email.com"></div>
                <div class="form-group" style="grid-column:1/-1"><label>Street Address</label><input id="fstreet" value="${formData.street}" placeholder="House no, Street, Area"></div>
                <div class="form-group"><label>City</label><input id="fcity" value="${formData.city}" placeholder="City"></div>
                <div class="form-group"><label>State</label><input id="fstate" value="${formData.state}" placeholder="State"></div>
                <div class="form-group"><label>Pincode</label><input id="fpin" value="${formData.pincode}" placeholder="Pincode"></div>
              </div>
            </div>
            <div class="checkout-section reveal delay-2">
              <h3><i class="fas fa-credit-card"></i> Payment Method</h3>
              ${['COD','UPI','Card','NetBanking'].map(m => `
                <label style="display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #eee;border-radius:8px;margin-bottom:10px;cursor:pointer;${paymentMethod===m?'border-color:var(--green);background:#f0f7f0':''}" onclick="paymentMethod='${m}'; renderCheckout()">
                  <input type="radio" name="pay" ${paymentMethod===m?'checked':''}>
                  <i class="fas ${m==='COD'?'fa-money-bill-wave':m==='UPI'?'fa-mobile-alt':m==='Card'?'fa-credit-card':'fa-university'}"></i>
                  <span style="font-weight:500">${m==='COD'?'Cash on Delivery':m}</span>
                </label>
              `).join('')}
            </div>
          </div>
          <div>
            <div class="cart-summary reveal delay-1">
              <h3>Order Summary</h3>
              ${items.map(i => `
                <div class="checkout-item">
                  <img src="${i.image}" alt="${i.name}">
                  <div class="checkout-item-info"><h4>${i.name}</h4><p>${i.weight}g x ${i.quantity}</p></div>
                  <span style="font-weight:600">${i.price*i.quantity}.00</span>
                </div>
              `).join('')}
              <div style="margin-top:15px">
                <div class="cart-summary-row"><span>Subtotal</span><span>${subtotal}.00</span></div>
                <div class="cart-summary-row"><span>Shipping</span><span>${shipping===0?'FREE':shipping+'.00'}</span></div>
                <div class="cart-summary-row total"><span>Total</span><span>${total}.00</span></div>
              </div>
              <button class="btn btn-primary" style="margin-top:15px;width:100%" onclick="placeOrder()">PLACE ORDER</button>
            </div>
          </div>
        </div>
      `;
      setTimeout(initScrollAnimations, 100);
    }

    function placeOrder() {
      formData = {
        name: document.getElementById('fname').value,
        phone: document.getElementById('fphone').value,
        email: document.getElementById('femail').value,
        street: document.getElementById('fstreet').value,
        city: document.getElementById('fcity').value,
        state: document.getElementById('fstate').value,
        pincode: document.getElementById('fpin').value,
      };
      if (!formData.name || !formData.phone || !formData.email || !formData.street || !formData.city) {
        showToast('Please fill all required fields!');
        return;
      }
      const subtotal = Cart.getSubtotal();
      const shipping = Cart.getShipping(subtotal);
      const order = Orders.create({
        items, userEmail: formData.email,
        shippingAddress: formData, paymentMethod,
        totalAmount: subtotal + shipping, subtotal, shippingCharge: shipping
      });
      Cart.clearCart();
      trackingId = order.trackingId;
      orderPlaced = true;
      renderSuccess();
    }

    function renderSuccess() {
      document.getElementById('checkoutContent').innerHTML = `
        <div class="order-success">
          <i class="fas fa-check-circle"></i>
          <h2 style="color:var(--green-dark);margin-bottom:10px">Order Placed Successfully!</h2>
          <p style="color:#666;margin-bottom:5px">Your order has been confirmed.</p>
          <p class="tracking-id">Tracking ID: ${trackingId}</p>
          <p style="color:#666;margin-bottom:20px">Save this tracking ID to track your order</p>
          <div style="display:flex;gap:15px;justify-content:center">
            <a href="track-order.html" class="btn btn-primary">Track Order</a>
            <a href="shop.html" class="btn btn-outline">Continue Shopping</a>
          </div>
        </div>
      `;
    }

    renderCheckout();
  </script>
</body>
</html>
