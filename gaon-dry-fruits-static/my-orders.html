<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - Gaon Dry Fruits</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="top-bar">
    <div class="container">
      <span><i class="fas fa-leaf"></i> 100% Natural</span>
      <span><i class="fas fa-truck"></i> Fast & Safe Delivery</span>
    </div>
  </div>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><div><div class="logo-text">Gaon</div><div class="logo-sub">Dry Fruits</div></div></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="my-orders.html" class="active">My Orders</a></li>
      </ul>
      <div class="nav-icons">
        <a href="#" onclick="User.logout();return false"><i class="fas fa-sign-out-alt"></i></a>
        <a href="cart.html" style="position:relative"><i class="fas fa-shopping-cart"></i><span class="cart-count" style="display:none">0</span></a>
      </div>
    </div>
  </nav>

  <div class="container orders-list">
    <h2 style="font-family:'Playfair Display';font-size:32px;color:var(--green-dark);margin-bottom:30px" class="reveal">My Orders</h2>
    <div id="ordersList"></div>
  </div>

  <script src="js/main.js"></script>
  <script>
    const user = User.getCurrent();
    if (!user) { window.location.href = 'login.html'; }
    
    const orders = user.isAdmin ? Orders.getAll() : Orders.getUserOrders(user.email);
    const container = document.getElementById('ordersList');

    if (orders.length === 0) {
      container.innerHTML = '<div class="empty-state"><h2>No orders yet</h2><p><a href="shop.html" style="color:var(--green)">Start shopping!</a></p></div>';
    } else {
      container.innerHTML = orders.map(o => `
        <div class="order-card reveal">
          <div class="order-card-header">
            <div><h4>Order #${o.trackingId}</h4><span style="font-size:12px;color:#999">${new Date(o.createdAt).toLocaleDateString()}</span></div>
            <span class="status-badge ${o.orderStatus.toLowerCase()}">${o.orderStatus}</span>
          </div>
          <div class="order-items">
            ${o.items.map(i => `<img src="${i.image}" alt="${i.name}" title="${i.name} x${i.quantity}">`).join('')}
          </div>
          <div class="order-card-footer">
            <span style="font-size:13px;color:#666">${o.items.length} items</span>
            <div>
              <span style="font-weight:700;font-size:16px;color:var(--green)">${o.totalAmount}.00</span>
              <a href="track-order.html" class="btn btn-primary" style="padding:6px 14px;font-size:12px;margin-left:15px">Track</a>
            </div>
          </div>
        </div>
      `).join('');
      setTimeout(initScrollAnimations, 100);
    }
  </script>
</body>
</html>
