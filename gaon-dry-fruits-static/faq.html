<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ - Gaon Dry Fruits</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="top-bar"><div class="container"><span><i class="fas fa-leaf"></i> 100% Natural</span><span><i class="fas fa-truck"></i> Fast & Safe Delivery</span></div></div>
  <nav class="navbar"><div class="container"><a href="index.html" class="logo"><div><div class="logo-text">Gaon</div><div class="logo-sub">Dry Fruits</div></div></a><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="shop.html">Shop</a></li><li><a href="about.html">About Us</a></li><li><a href="faq.html" class="active">FAQ</a></li></ul><div class="nav-icons"><a href="cart.html" style="position:relative"><i class="fas fa-shopping-cart"></i><span class="cart-count" style="display:none">0</span></a></div></div></nav>

  <div class="page-header"><h1>FAQ</h1><p>Frequently Asked Questions</p></div>

  <div class="container" style="padding:60px 0;max-width:700px" id="faqList"></div>

  <footer class="footer"><div class="container"><div class="footer-bottom" style="border:none;padding:20px 0"><p>© 2024 Gaon Dry Fruits. All Rights Reserved.</p></div></div></footer>
  <script src="js/main.js"></script>
  <script>
    const faqs = [
      {q:'What is the delivery time?',a:'We deliver within 3-5 business days across India. Metro cities get delivery in 2-3 days.'},
      {q:'Is there a minimum order value?',a:'No minimum order value. However, free shipping is available on orders above ₹999.'},
      {q:'Are your products 100% natural?',a:'Yes! All our dry fruits are 100% natural with no preservatives, chemicals, or artificial additives.'},
      {q:'What is your return policy?',a:'We offer 7-day return policy. If you are not satisfied with the quality, we will replace or refund.'},
      {q:'Do you offer bulk/corporate orders?',a:'Yes! We offer special pricing for bulk and corporate orders. Contact us at support@gaondryfruits.in'},
      {q:'How do I track my order?',a:'Once shipped, you will receive a tracking ID via email/SMS. Use the Track Order page to check status.'},
    ];
    document.getElementById('faqList').innerHTML = faqs.map((faq,i) => `
      <div class="faq-item">
        <button class="faq-question" onclick="this.nextElementSibling.classList.toggle('show')">${faq.q} <i class="fas fa-chevron-down"></i></button>
        <div class="faq-answer">${faq.a}</div>
      </div>
    `).join('');
  </script>
</body>
</html>
