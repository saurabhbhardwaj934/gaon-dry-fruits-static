<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Gaon Dry Fruits</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><div><div class="logo-text">Gaon</div><div class="logo-sub">Dry Fruits</div></div></a>
      <div class="nav-icons">
        <a href="index.html">View Store</a>
        <a href="#" onclick="User.logout();return false"><i class="fas fa-sign-out-alt"></i></a>
      </div>
    </div>
  </nav>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <h3>Gaon Admin</h3>
      <ul>
        <li><a href="#" class="active" onclick="showTab('dashboard',this)"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
        <li><a href="#" onclick="showTab('products',this)"><i class="fas fa-box"></i> Products</a></li>
        <li><a href="#" onclick="showTab('orders',this)"><i class="fas fa-shopping-bag"></i> Orders</a></li>
        <li><a href="#" onclick="showTab('users',this)"><i class="fas fa-users"></i> Users</a></li>
        <li><a href="index.html"><i class="fas fa-store"></i> View Store</a></li>
      </ul>
    </aside>
    <div class="admin-content" id="adminContent">
      <!-- Filled by JS -->
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    const user = User.getCurrent();
    if (!user || !user.isAdmin) { window.location.href = 'login.html'; }

    let currentTab = 'dashboard';
    let products = JSON.parse(JSON.stringify(PRODUCTS));
    let editProduct = null;

    function showTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.admin-sidebar a').forEach(a => a.classList.remove('active'));
      if (el) el.classList.add('active');
      renderAdmin();
    }

    function renderAdmin() {
      const content = document.getElementById('adminContent');
      
      if (currentTab === 'dashboard') {
        const allOrders = Orders.getAll();
        const totalRevenue = allOrders.filter(o => o.orderStatus !== 'Cancelled').reduce((s,o) => s + o.totalAmount, 0);
        const pending = allOrders.filter(o => o.orderStatus === 'Pending').length;
        content.innerHTML = `
          <h2 style="font-family:'Playfair Display';font-size:28px;color:var(--green-dark);margin-bottom:25px">Dashboard Overview</h2>
          <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon green"><i class="fas fa-shopping-bag"></i></div><h3>${allOrders.length}</h3><p>Total Orders</p></div>
            <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-clock"></i></div><h3>${pending}</h3><p>Pending Orders</p></div>
            <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-rupee-sign"></i></div><h3>${totalRevenue}</h3><p>Total Revenue</p></div>
            <div class="stat-card"><div class="stat-icon red"><i class="fas fa-chart-line"></i></div><h3>${products.length}</h3><p>Total Products</p></div>
          </div>
          <div class="admin-table">
            <div class="admin-table-header"><h3>Recent Orders</h3></div>
            ${allOrders.length ? `<table><thead><tr><th>Order ID</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody>
              ${allOrders.slice(0,5).map(o => `<tr><td><strong>${o.trackingId}</strong></td><td>${new Date(o.createdAt).toLocaleDateString()}</td><td>${o.totalAmount}</td><td><span class="status-badge ${o.orderStatus.toLowerCase()}">${o.orderStatus}</span></td></tr>`).join('')}
            </tbody></table>` : '<p style="padding:20px;color:#999">No orders yet</p>'}
          </div>
        `;
      }
      
      else if (currentTab === 'products') {
        content.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:25px">
            <h2 style="font-family:'Playfair Display';font-size:28px;color:var(--green-dark)">Products Management</h2>
            <button class="btn btn-primary" onclick="openProductModal()"><i class="fas fa-plus"></i> Add Product</button>
          </div>
          <div class="admin-table">
            <table><thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Weight</th><th>Stock</th><th>Actions</th></tr></thead><tbody>
              ${products.map(p => `<tr>
                <td><img src="${p.image}" style="width:40px;height:40px;object-fit:cover;border-radius:4px" onerror="this.src='https://via.placeholder.com/40'"></td>
                <td><strong>${p.name}</strong>${p.nameHindi?`<div style="font-size:11px;color:#999">${p.nameHindi}</div>`:''}</td>
                <td>${p.category}</td><td>${p.price}</td><td>${p.weight}g</td><td>${p.stock}</td>
                <td>
                  <button onclick="openProductModal(${p.id})" style="background:none;border:none;color:var(--green);margin-right:10px;cursor:pointer"><i class="fas fa-edit"></i></button>
                  <button onclick="deleteProduct(${p.id})" style="background:none;border:none;color:#e74c3c;cursor:pointer"><i class="fas fa-trash"></i></button>
                </td>
              </tr>`).join('')}
            </tbody></table>
          </div>
          <div id="productModal"></div>
        `;
      }
      
      else if (currentTab === 'orders') {
        const allOrders = Orders.getAll();
        content.innerHTML = `
          <h2 style="font-family:'Playfair Display';font-size:28px;color:var(--green-dark);margin-bottom:25px">Orders Management</h2>
          <div class="admin-table">
            ${allOrders.length ? `<table><thead><tr><th>Order ID</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody>
              ${allOrders.map(o => `<tr>
                <td><strong>${o.trackingId}</strong></td>
                <td>${new Date(o.createdAt).toLocaleDateString()}</td>
                <td>${o.shippingAddress?.name||'Guest'}<br><span style="font-size:11px;color:#999">${o.userEmail||''}</span></td>
                <td>${o.items?.length||0} items</td>
                <td><strong>${o.totalAmount}</strong></td>
                <td><span class="status-badge ${o.orderStatus.toLowerCase()}">${o.orderStatus}</span></td>
                <td>
                  <select onchange="Orders.updateStatus('${o.trackingId}',this.value); renderAdmin()" style="padding:4px 8px;border-radius:4px;border:1px solid #ddd;font-size:12px;margin-right:5px">
                    ${['Pending','Confirmed','Processing','Shipped','Delivered','Cancelled'].map(s => `<option ${o.orderStatus===s?'selected':''}>${s}</option>`).join('')}
                  </select>
                  <button onclick="printOrderLabel('${o.trackingId}')" style="background:var(--green);color:white;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px"><i class="fas fa-print"></i></button>
                </td>
              </tr>`).join('')}
            </tbody></table>` : '<p style="padding:20px;color:#999">No orders yet</p>'}
          </div>
        `;
      }
      
      else if (currentTab === 'users') {
        const savedUsers = JSON.parse(localStorage.getItem('gaon_users') || '[]');
        content.innerHTML = `
          <h2 style="font-family:'Playfair Display';font-size:28px;color:var(--green-dark);margin-bottom:25px">Users</h2>
          <div class="admin-table">
            <table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th></tr></thead><tbody>
              <tr><td>Admin</td><td>admin@gaondryfruits.in</td><td>9876543210</td><td><span class="status-badge confirmed">Admin</span></td></tr>
              ${savedUsers.map(u => `<tr><td>${u.name}</td><td>${u.email}</td><td>${u.phone||'-'}</td><td><span class="status-badge pending">Customer</span></td></tr>`).join('')}
            </tbody></table>
          </div>
        `;
      }
    }

    function openProductModal(id) {
      const product = id ? products.find(p => p.id === id) : { name:'', nameHindi:'', category:'Badam', price:0, maxPrice:0, weight:250, description:'', image:'', isBestSeller:false, stock:100 };
      editProduct = product;
      document.getElementById('productModal').innerHTML = `
        <div class="modal-overlay" onclick="closeModal()">
          <div class="modal" onclick="event.stopPropagation()">
            <h3>${id ? 'Edit' : 'Add'} Product</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
              <div class="form-group"><label>Name</label><input id="pName" value="${product.name}"></div>
              <div class="form-group"><label>Name (Hindi)</label><input id="pHindi" value="${product.nameHindi||''}"></div>
              <div class="form-group"><label>Category</label><select id="pCat">${CATEGORIES.filter(c=>c!=='All').map(c=>`<option ${c===product.category?'selected':''}>${c}</option>`).join('')}</select></div>
              <div class="form-group"><label>Weight (g)</label><select id="pWeight">${[100,250,500,1000].map(w=>`<option value="${w}" ${w===product.weight?'selected':''}>${w}g</option>`).join('')}</select></div>
              <div class="form-group"><label>Price</label><input type="number" id="pPrice" value="${product.price}"></div>
              <div class="form-group"><label>Max Price</label><input type="number" id="pMax" value="${product.maxPrice||0}"></div>
              <div class="form-group"><label>Stock</label><input type="number" id="pStock" value="${product.stock}"></div>
              <div class="form-group" style="display:flex;align-items:flex-end"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="pBest" ${product.isBestSeller?'checked':''}> Best Seller</label></div>
              <div class="form-group" style="grid-column:1/-1"><label>Image URL</label><input id="pImg" value="${product.image}"></div>
              <div class="form-group" style="grid-column:1/-1"><label>Description</label><textarea id="pDesc" rows="3">${product.description||''}</textarea></div>
            </div>
            <div class="modal-actions">
              <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
              <button class="btn btn-primary" onclick="saveProduct()">${id?'Update':'Create'} Product</button>
            </div>
          </div>
        </div>
      `;
    }

    function closeModal() {
      document.getElementById('productModal').innerHTML = '';
      editProduct = null;
    }

    function saveProduct() {
      const data = {
        name: document.getElementById('pName').value,
        nameHindi: document.getElementById('pHindi').value,
        category: document.getElementById('pCat').value,
        weight: parseInt(document.getElementById('pWeight').value),
        price: parseInt(document.getElementById('pPrice').value),
        maxPrice: parseInt(document.getElementById('pMax').value),
        stock: parseInt(document.getElementById('pStock').value),
        isBestSeller: document.getElementById('pBest').checked,
        image: document.getElementById('pImg').value,
        description: document.getElementById('pDesc').value,
      };
      if (editProduct && editProduct.id) {
        const idx = products.findIndex(p => p.id === editProduct.id);
        products[idx] = { ...products[idx], ...data };
      } else {
        data.id = Date.now();
        products.push(data);
      }
      closeModal();
      renderAdmin();
      showToast('Product saved!');
    }

    function deleteProduct(id) {
      if (!confirm('Delete this product?')) return;
      products = products.filter(p => p.id !== id);
      renderAdmin();
      showToast('Product deleted');
    }

    function printOrderLabel(trackingId) {
      window.open('track-order.html?track='+trackingId, '_blank');
    }

    renderAdmin();
  </script>
</body>
</html>
